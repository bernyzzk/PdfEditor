[project]
name = "pdfeditor"
version = "0.6.0"
description = "Editeur PDF desktop local pour Windows"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.26,<2",
    "PySide6>=6.9,<7",
]

[project.scripts]
pdfeditor = "pdf_editor.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdf_editor*"]
